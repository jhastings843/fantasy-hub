<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NBA — coming soon</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#0b1d33;--navy2:#16304f;--cream:#fffbf2;--paper:#fff;--rule:#e6e2d8;--rule2:#f0ece2;
--ink:#0b1d33;--body:#4a5668;--mute:#8a8578;--accent:#1c4e7a;--pos:#0f7b5f;--neg:#a8443c;
--sans:'Inter',system-ui,-apple-system,sans-serif;--serif:'Source Serif 4',Georgia,serif;
--mono:'IBM Plex Mono',ui-monospace,monospace;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;
font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%;text-size-adjust:100%}
a{color:inherit;text-decoration:none}
img{max-width:100%}
header{background:var(--navy);color:var(--cream);position:sticky;top:env(safe-area-inset-top,0);z-index:20}
.hbar{max-width:1080px;margin:0 auto;padding:12px 24px;display:flex;justify-content:space-between;
align-items:center;gap:16px}
/* The header ran 2px past the viewport on a 360px phone — the nav's four sport links plus the
   wordmark need a little more than that width at full padding. Narrow phones get tighter
   padding and gaps rather than a wrapped or scrolling header. */
@media(max-width:380px){
 .hbar{padding:12px 14px;gap:8px}
 .hright{gap:4px}
}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand .mk{width:38px;height:38px;border-radius:50%;background:var(--cream);color:var(--navy);
display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;
font-size:17px;letter-spacing:.5px;flex:none}
.bt{display:flex;flex-direction:column;line-height:1.1}
.bt .n1{font-family:var(--serif);font-size:17px;font-weight:700;letter-spacing:2px}
.bt .n2{font-family:var(--mono);font-size:8.5px;letter-spacing:2.4px;color:#9fb3c8;margin-top:3px}
.hright{display:flex;align-items:center;gap:10px;min-width:0}
.search{display:flex;align-items:center}
.sbtn{background:transparent;border:0;color:#9fb3c8;padding:7px;border-radius:6px;cursor:pointer;
display:flex}
.sbtn:hover{color:var(--cream);background:rgba(255,251,242,.12)}
.search input{width:0;opacity:0;padding:0;border:0;border-radius:6px;background:rgba(255,251,242,.12);
color:var(--cream);font-family:var(--sans);font-size:16px;transition:width .18s ease,opacity .18s ease,
padding .18s ease;outline:none;min-width:0}
.search input::placeholder{color:#8ba1b8}
.search.open input{width:170px;opacity:1;padding:7px 10px}
.search.open .sbtn{color:var(--cream)}
.nores{padding:26px 0;color:var(--mute);font-family:var(--mono);font-size:12px;letter-spacing:1px}
nav{display:flex;gap:2px}
nav a{font-family:var(--mono);font-size:11px;letter-spacing:1.3px;color:#9fb3c8;padding:8px 12px;border-radius:5px}
nav a.on{color:var(--cream);background:rgba(255,251,242,.13)}
.hero{background:var(--cream);border-bottom:1px solid var(--rule)}
.hero .in{max-width:1080px;margin:0 auto;padding:44px 24px 34px}
h1{font-family:var(--serif);font-size:50px;font-weight:600;line-height:1.05;letter-spacing:-.7px;color:var(--navy)}
.sub{color:var(--body);font-size:16px;line-height:1.65;margin-top:13px;max-width:62ch}
.stamp{font-family:var(--mono);font-size:11px;color:var(--mute);letter-spacing:.7px;margin-top:15px}
.strip{background:var(--cream);border-bottom:1px solid var(--rule)}
.strip .grid{max-width:1080px;margin:0 auto;padding:0 24px 28px;display:grid;
grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:28px}
.cmp{margin-top:18px}
.cmprow{display:grid;grid-template-columns:86px repeat(3,1fr);gap:14px;align-items:center;
padding:13px 0;border-top:1px solid var(--rule2)}
.cl{font-family:var(--mono);font-size:10px;letter-spacing:1.6px;color:var(--mute)}
.cmprow .lbl{margin-bottom:3px}
.cv{font-family:var(--mono);font-size:14px;color:var(--body);display:block}
.cv.big{font-weight:700;color:var(--navy)}
.pick{display:grid;grid-template-columns:2fr 1.3fr .7fr 1.1fr 1fr .8fr;gap:14px;align-items:center;
padding:13px 0;border-top:1px solid var(--rule2)}
.pg{display:flex;flex-direction:column;min-width:0}
.pd{font-family:var(--mono);font-size:10px;color:var(--mute);letter-spacing:.5px}
.pm{font-size:14px;font-weight:600;color:var(--ink);margin-top:2px}
.pf{display:flex;flex-direction:column;min-width:0}
.pf .lbl{margin-bottom:3px}
.pv{font-family:var(--mono);font-size:13px;color:var(--body);white-space:nowrap;overflow:hidden;
text-overflow:ellipsis}
.pf.res .pv{font-weight:700}
.filterbar{font-family:var(--mono);font-size:10.5px;letter-spacing:1.2px;color:var(--mute);
padding:18px 0 4px;text-transform:uppercase}
.tile.on{background:var(--navy);color:var(--cream)}
.tile.on .k,.tile.on .n{color:#9fb3c8}
.tile.on .v{color:var(--cream)}
.tile{display:block;color:inherit;border-radius:9px;padding:4px 6px;margin:-4px -6px}
.tile:hover{background:#f4eee1}
.tile:hover .v{color:var(--accent)}
.k{font-family:var(--mono);font-size:9.5px;letter-spacing:1.5px;color:var(--mute)}
.v{font-family:var(--serif);font-size:25px;font-weight:700;color:var(--navy);margin-top:6px}
.n{font-size:12px;color:var(--body);margin-top:3px}
.wrap{max-width:1080px;margin:0 auto;padding:8px 24px 80px}
.day{display:flex;align-items:baseline;gap:12px;margin:36px 0 13px}
.day h2{font-family:var(--serif);font-size:24px;font-weight:600;color:var(--navy)}
.day span{font-family:var(--mono);font-size:10px;color:var(--mute);letter-spacing:1.3px}
.game{border:1px solid var(--rule);border-radius:10px;padding:16px 18px;margin-bottom:10px}
.game:hover{border-color:#d6d0c2;background:#fffdf8}
.when{display:flex;gap:8px;font-family:var(--mono);font-size:10.5px;color:var(--mute);letter-spacing:.6px;
margin-bottom:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.when span:last-child{overflow:hidden;text-overflow:ellipsis}
.when .dot{color:var(--rule)}
.teams{display:grid;gap:10px}
.team{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:12px}
.team img{width:28px;height:28px;object-fit:contain}
.tn{display:flex;flex-direction:column;min-width:0}
.nm{font-size:15px;font-weight:600;color:var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec{font-family:var(--mono);font-size:10.5px;color:var(--mute);margin-top:1px}
.pts{font-family:var(--mono);font-size:22px;font-weight:600;color:var(--body)}
.team.win .nm,.team.win .pts{color:var(--navy);font-weight:700}
/* three fields, label above value, left aligned. Fixed columns so they can never wrap onto
   each other, and values are allowed to wrap rather than being cut off. */
.mkt{display:grid;grid-template-columns:repeat(2, minmax(130px, max-content));gap:14px 34px;
margin-top:14px;padding-top:13px;border-top:1px solid var(--rule2)}
.pickrow{display:flex;align-items:baseline;gap:12px;margin-top:12px;padding-top:11px;
border-top:1px solid var(--rule2)}
.pickval{font-size:14.5px;font-weight:700;color:var(--accent);overflow:visible;text-overflow:clip;
white-space:normal}
.lbl{display:block;font-family:var(--mono);font-size:9px;letter-spacing:1.3px;color:var(--mute)}
.val{display:block;font-size:13.5px;font-weight:600;color:var(--body);margin-top:5px;
white-space:normal;overflow:visible;overflow-wrap:anywhere}
.val.mono{font-family:var(--mono)}
.pick .val{color:var(--accent);font-weight:700}
.bdbtn{display:inline-flex;align-items:center;gap:7px;margin-top:14px;padding:8px 14px;border:1px solid var(--rule);
border-radius:7px;font-family:var(--mono);font-size:10px;letter-spacing:1.4px;color:var(--navy);background:var(--cream)}
.bdbtn:hover{background:var(--navy);color:var(--cream);border-color:var(--navy)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btnrow .bdbtn{margin-top:14px}
/* .bdbtn.alt and .bdbtn:hover carry the same specificity, and this rule sits after the hover
   one, so it was winning the background while hover still won the colour: cream text on a pale
   background, which reads as the button going blank. The alt variant needs its own hover. */
.bdbtn.alt{background:var(--paper)}
.bdbtn.alt:hover{background:var(--navy);color:var(--cream);border-color:var(--navy)}
/* The prop analyzer is the one button that leaves this cream world for a dark page, so it is
   the one button that does not look like the others. Outline only — a filled green block beside
   two outlined buttons would read as the primary action, and it is not.
   ONE PLACE TO CHANGE THE GREEN: --ps below. */
:root{--ps:#0f8f55}
.bdbtn.ps.lk{background:var(--paper);color:var(--mute);border-color:var(--rule);
 cursor:default;pointer-events:none}
.bdbtn.ps.lk::before{content:"F512";margin-right:2px;font-size:10px;opacity:.75}
.bdbtn.ps{background:var(--cream);color:var(--ps);border-color:var(--ps)}
.bdbtn.ps:hover,.bdbtn.ps:focus-visible{background:var(--ps);color:var(--cream);
 border-color:var(--ps)}
/* ---- player prop analyzer. Lives in this stylesheet rather than its own so it inherits the
   site's type, colour and spacing automatically — the first version shipped a dark theme of its
   own and the newest tool read as a different product. */
/* top plays — the one green thing on an otherwise navy-and-cream page, because it is the one
   part of the board that is a recommendation rather than a reading */
.tp{--g:#0f8f55;border:1px solid var(--g);border-radius:12px;background:#f2faf6;
 padding:16px 18px;margin:18px 0 6px}
.tp-k{font-family:var(--mono);font-size:10px;letter-spacing:1.8px;text-transform:uppercase;
 color:var(--g);font-weight:700;margin-bottom:12px}
.tp-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tp-c{background:var(--paper);border:1px solid #cde8da;border-radius:9px;padding:13px 14px}
.tp-n{font-weight:700;font-size:15px}
.tp-n em{font-style:normal;font-family:var(--mono);font-size:10px;color:var(--mute);
 letter-spacing:1px;margin-left:7px}
.tp-b{font-family:var(--mono);font-size:19px;font-weight:600;color:var(--g);margin-top:5px}
.tp-b span{font-size:11px;color:var(--body);font-weight:400;margin-left:5px}
.tp-m{font-family:var(--mono);font-size:11px;color:var(--body);margin-top:4px}
.tp-w{font-size:12.5px;color:var(--body);margin-top:8px;line-height:1.5}
.tp-none p{color:var(--body);font-size:13px;margin:0}
@media(max-width:560px){.tp-row{grid-template-columns:1fr}.tp{padding:14px}}
.pp-note{color:var(--body);font-size:13.5px;max-width:64ch;margin:14px 0 2px}
.pp-meta{font-family:var(--mono);font-size:11.5px;color:var(--mute);margin:16px 0 2px;
 line-height:1.9;letter-spacing:.2px}
.pp-meta b{color:var(--body);font-weight:600}
/* The game tiles an index is built from. These lived ONLY in nfl_props._shell, so any page
   using the site shell — the demo index, for one — rendered them as unstyled run-together
   text with no rule, no card and no hover. One copy, reachable from both. */
.gcard{display:flex;align-items:center;gap:14px;border:1px solid var(--rule);
 border-radius:12px;background:var(--cream);padding:15px 16px;margin:11px 0;
 text-decoration:none;color:inherit;transition:border-color .12s,background .12s}
.gcard:hover{border-color:var(--navy);background:var(--paper)}
.gname{font-family:var(--mono);font-weight:600;font-size:15px;letter-spacing:.3px;flex:1;
 min-width:0}
.gname span{color:var(--mute);font-weight:400}
.gmeta{font-family:var(--mono);font-size:11px;color:var(--mute);text-align:right;
 line-height:1.7;flex:none}
.go{font-family:var(--mono);font-weight:700;font-size:10px;letter-spacing:1.3px;
 color:var(--ps)}
@media(max-width:560px){
 .gcard{flex-wrap:wrap;gap:6px;padding:13px 14px}
 .gname{flex:1 0 100%;font-size:14.5px}
 .gmeta{text-align:left;flex:1}
}
.pp-mkt{display:flex;align-items:center;gap:12px;margin:30px 0 2px}
.pp-mkt h3{font-family:var(--mono);font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;
 color:var(--mute);font-weight:600}
.pp-mkt span{height:1px;background:var(--rule);flex:1}
.pp{border-top:1px solid var(--rule2);padding:0}
.pp:first-of-type{border-top:0}
.pp>summary{display:flex;align-items:baseline;gap:9px;padding:12px 2px;cursor:pointer;
 list-style:none}
.pp>summary::-webkit-details-marker{display:none}
.pp>summary:hover{background:var(--cream)}
.pp .nm{font-weight:600;font-size:15px}
.pp .tm{font-family:var(--mono);font-size:10.5px;color:var(--mute);letter-spacing:1px}
.pp .sp{flex:1}
.pp .num{font-family:var(--mono);font-size:13px}
.pp .best{color:var(--accent);font-weight:600}
.pp .pp-proj,.pp .pp-line{font-family:var(--mono);font-size:12px;color:var(--mute);
 white-space:nowrap;min-width:92px;text-align:right}
.pp .pp-proj em,.pp .pp-line em{font-style:normal;font-size:9.5px;letter-spacing:1.2px;
 text-transform:uppercase}
.pp .pp-proj b{color:var(--accent);font-size:14px;font-weight:600;margin-left:3px}
.pp .pp-line b{color:var(--ink);font-size:14px;font-weight:600;margin-left:3px}
.pp-best{font-family:var(--mono);font-size:11.5px;color:var(--body);padding:2px 2px 10px}
.pp-best b{color:var(--accent);font-size:12.5px}
.pp .gapv{font-family:var(--mono);font-size:12px;color:var(--pos);min-width:62px;text-align:right}
.pp .gapv.nil{color:var(--mute)}
/* The simulated distribution as MASS, not as fifty loose marks. One accent on the half that
   wins, everything else in ink and rule; the fifty draws survive as a hairline rug so the
   individual nights are still countable under a shape that reads from across a room. */
.sd-chart{display:block;width:100%;max-width:860px;height:auto;margin:12px 0 2px}
.sd-area{fill:var(--ink);opacity:.07}
.sd-area.o{fill:var(--pos);opacity:.17}
.sd-crest{fill:none;stroke:var(--ink);stroke-width:1.4;opacity:.42;
 stroke-linejoin:round;stroke-linecap:round}
.sd-base{stroke:var(--ink);stroke-width:1;opacity:.3}
.sd-rug{stroke-width:1.1;opacity:.5}
.sd-rug.o{stroke:var(--pos);opacity:.75}
.sd-rug.u{stroke:var(--ink);opacity:.3}
.sd-line{stroke:var(--ink);stroke-width:1.5;opacity:.9}
.sd-proj{stroke:var(--accent);stroke-width:1.2;stroke-dasharray:4 3.5;opacity:.6}
.sd-tick{stroke:var(--ink);stroke-width:1;opacity:.25}
.sd-ax{font-family:var(--mono);font-size:10.5px;fill:var(--mute);text-anchor:middle;
 letter-spacing:.4px}
.sd-ax.hi{fill:var(--ink);font-weight:700;font-size:12px;letter-spacing:.2px}
.sd-ax.md{fill:var(--accent);font-weight:600}
.dots-k{font-family:var(--mono);font-size:10.5px;color:var(--mute);padding:3px 2px 10px;
 letter-spacing:.3px}
.dots-k b{color:var(--body)}
.pp .chev{color:var(--mute);font-size:15px;transition:transform .15s}
.pp[open] .chev{transform:rotate(90deg)}
/* PHONE: the summary row is six items in a baseline flex, which needs about 395px and gets 390.
   So every row wrapped, the win-probability figure dropped to a second line on its own, and a
   long name pushed the chevron onto a THIRD line by itself. Rather than shrink type until it
   fits, the row is given a deliberate break: name and team on top, the two numbers and the
   figure underneath. The spacer that right-aligns things on desktop is what forces the break,
   so the desktop layout is untouched. */
.pp-id,.pp-figs{display:flex;align-items:baseline;gap:9px;min-width:0}
/* PHONE: an explicit grid, because flex-wrap broke the row in a different place on every line.
   Letting it wrap put the figure alone on line two for one player, the line and the figure on
   line two for the next, and the chevron alone on line THREE for a long name — a column of
   rows that each looked broken in their own way. A grid says where the two groups go, so every
   row breaks identically: who it is on top, the numbers underneath, figure and chevron right. */
@media(max-width:560px){
 .pp>summary{display:grid;grid-template-columns:1fr auto auto;
  grid-template-areas:"id gap chev" "figs figs figs";
  align-items:center;column-gap:9px;row-gap:5px;padding:12px 2px 13px}
 .pp .pp-id{grid-area:id}
 .pp .pp-figs{grid-area:figs}
 .pp .gapv{grid-area:gap;min-width:0;font-size:12.5px}
 .pp .chev{grid-area:chev;font-size:17px}
 .pp .sp{display:none}
 .pp .nm{font-size:16px}
 .pp .pp-proj,.pp .pp-line{font-size:12.5px}
 .pp-best{font-size:11px;line-height:1.6}
 .pp-meta{font-size:11px;line-height:1.85}
}
.pp-body{padding:2px 2px 16px}
.pp-tbl{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12px}
.pp-tbl th{text-align:right;font-size:9.5px;letter-spacing:1.3px;text-transform:uppercase;
 color:var(--mute);font-weight:600;padding:5px 7px;border-bottom:1px solid var(--rule)}
.pp-tbl th:first-child{text-align:left}
.pp-tbl td{text-align:right;padding:6px 7px;border-bottom:1px solid var(--rule2)}
.pp-tbl td:first-child{text-align:left;color:var(--body)}
.pp-tbl tr.win td{background:#f3f8f5}
.pp-tbl tr.win td:first-child{font-weight:600;color:var(--ink)}
.pp-ctx{margin-top:11px;color:var(--mute);font-size:12px;line-height:1.6}
.pp-ctx b{color:var(--body);font-weight:600;font-family:var(--mono)}
@media(max-width:560px){
 .pp>summary{flex-wrap:wrap;gap:2px 10px;padding:12px 0}
 .pp .pp-proj,.pp .pp-line{min-width:0;text-align:left}
 .pp .sp{display:none}
 .pp .gapv{margin-left:auto}
 .pp-tbl{font-size:11.5px}
 .pp-tbl th,.pp-tbl td{padding:5px 4px}
}
.hero.landing .in{padding:64px 24px 52px;text-align:center}
.hero.landing .mark{width:74px;height:74px;border-radius:50%;background:var(--navy);color:var(--cream);
display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:30px;
font-weight:700;letter-spacing:1px;margin:0 auto 22px}
.hero.landing h1{font-size:58px}
.lead{font-size:19px;line-height:1.6;color:var(--ink);margin:18px auto 0;max-width:34ch;font-weight:500}
.hero.landing .sub{margin:16px auto 0;max-width:62ch}
.lrec{margin:30px auto 0;padding:18px 24px;border:1px solid var(--rule);border-radius:11px;
background:var(--paper);display:inline-block}
.lrec .v{font-family:var(--serif);font-size:30px;font-weight:700;color:var(--navy);margin-top:4px}
.lrec .n{font-size:12.5px;color:var(--body);margin-top:3px}
.lrec a{color:var(--accent);font-weight:600}
.lrrow{display:flex;gap:30px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.lrcell .k{font-family:var(--mono);font-size:10.5px;letter-spacing:1.4px;color:var(--mute)}
.lrcell .v{font-size:27px}
@media(max-width:520px){.lrrow{gap:20px}.lrcell .v{font-size:23px}}
.sportgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:34px}
.sportcard{display:flex;flex-direction:column;gap:4px;padding:22px;border:1px solid var(--rule);
border-radius:11px;background:var(--paper)}
.sportcard:hover{border-color:var(--navy);background:var(--cream)}
.sportcard .sp{font-family:var(--serif);font-size:25px;font-weight:700;color:var(--navy)}
.sportcard .sn{font-size:13px;color:var(--body)}
.sportcard .sgo{font-family:var(--mono);font-size:10px;letter-spacing:1.3px;color:var(--accent);margin-top:10px}
.sportcard.off{opacity:.62}
.sportcard.off:hover{opacity:1}
.sportcard.off .sgo{color:var(--mute)}
.soonbox{border:1px solid var(--rule);border-radius:14px;padding:30px 28px;background:var(--paper);
 max-width:620px;margin:30px 0}
.soonbox .soonk{font-family:var(--mono);font-size:11px;letter-spacing:1.6px;text-transform:uppercase;
 color:var(--accent);margin-bottom:12px}
.soonbox p{margin:0 0 16px;line-height:1.6}
.soonbox .soonline{font-family:var(--serif);font-size:22px;color:var(--navy);line-height:1.4}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:26px}
.how .hn{font-family:var(--mono);font-size:10px;letter-spacing:1.6px;color:var(--mute)}
.how h4{font-size:15.5px;font-weight:600;color:var(--navy);margin:7px 0 6px}
.how p{font-size:13.5px;line-height:1.65;color:var(--body)}
footer{border-top:1px solid var(--rule);background:var(--cream)}
.notice{background:#c0271d;color:#fff}
.notice .in{max-width:1100px;margin:0 auto;padding:9px 20px;font:600 11.5px/1.45 'IBM Plex Mono',monospace;
  letter-spacing:.08em;text-transform:uppercase;text-align:center}
footer .in{max-width:1080px;margin:0 auto;padding:24px;color:var(--mute);font-size:12.5px;line-height:1.75;max-width:78ch}
/* breakdown page */
.back{font-family:var(--mono);font-size:10px;letter-spacing:1.4px;color:var(--mute)}
.bd h1{font-size:40px}
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px;margin:26px 0 8px;
background:var(--cream);border:1px solid var(--rule);border-radius:12px;padding:26px 24px}
.sc{display:flex;flex-direction:column;align-items:center;gap:9px;text-align:center}
.sc img{width:54px;height:54px;object-fit:contain}
.sc .t{font-size:15px;font-weight:600;color:var(--body)}
.sc .p{font-family:var(--mono);font-size:44px;font-weight:700;color:var(--navy);line-height:1}
.sc.lose .p,.sc.lose .t{color:var(--mute)}
.vs{font-family:var(--mono);font-size:11px;color:var(--mute);letter-spacing:2px}
.sec{margin-top:40px}
.sec>h3{font-family:var(--mono);font-size:10px;letter-spacing:2.2px;color:var(--mute);
padding-bottom:9px;border-bottom:1px solid var(--rule);margin-bottom:16px}
.sec>h3 b{color:var(--navy);font-weight:600}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-family:var(--mono);font-size:9px;letter-spacing:1.3px;color:var(--mute);text-align:right;
font-weight:500;padding:0 0 9px}
th:first-child{text-align:left}
td{padding:9px 0;border-top:1px solid var(--rule2);text-align:right;font-family:var(--mono);color:var(--body)}
td:first-child{text-align:left;font-family:var(--sans);color:var(--ink)}
td.big{font-weight:700;color:var(--navy)}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.bar{display:grid;grid-template-columns:150px 1fr 96px;align-items:center;gap:14px;padding:9px 0;
border-top:1px solid var(--rule2)}
.bar .t{font-size:13.5px}
.track{position:relative;height:9px;background:var(--rule2);border-radius:5px}
.track i{position:absolute;top:0;height:9px;border-radius:5px;background:var(--navy)}
.track u{position:absolute;top:-4px;bottom:-4px;width:1px;background:var(--rule);left:50%}
.bar .a{font-family:var(--mono);font-size:12px;text-align:right;color:var(--body)}
.radars{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.rtitle{font-family:var(--mono);font-size:9.5px;letter-spacing:1.6px;color:var(--mute);margin-bottom:6px;
text-align:center}
.legend{display:flex;gap:20px;justify-content:center;margin-top:8px;font-size:12px;color:var(--body)}
.legend .sw{display:inline-block;width:14px;height:3px;margin-right:7px;vertical-align:middle}
.legend .sw.home{background:var(--navy)}
.legend .sw.away{background:var(--neg)}
.why{background:var(--cream);border:1px solid var(--rule);border-radius:11px;padding:20px 22px;margin-top:8px}
.why p{font-size:14px;line-height:1.7;color:var(--body)}
.why .hl{font-weight:700;color:var(--navy)}
.note{font-size:12px;color:var(--mute);line-height:1.7;margin-top:10px}
@media(max-width:640px){
 h1{font-size:33px}.bd h1{font-size:27px}.hero .in{padding:28px 16px 22px}
 .wrap{padding:8px 16px 70px}.strip .grid{padding:0 16px 22px;gap:18px}
 /* 7px of padding on 10px text gives a 26px tap target; a thumb wants 44. Measured in a phone
    viewport rather than guessed at — the nav is on every page, so it is the one thing everybody
    has to hit. Minimum body text goes to 11px at the same time: below that it is a squint. */
 .hbar{padding:8px 12px}
 nav a{padding:13px 10px;font-size:11px;letter-spacing:.8px}
 .sportcard .sgo,.lrec .k,.lrcell .k,.when,.stamp,.foot{font-size:11px}
 /* the two buttons on every game card are the main thing anyone taps on a phone */
 .bdbtn{padding:13px 15px;font-size:10.5px}
 .btnrow{gap:10px}
 .mkt{grid-template-columns:1fr 1fr;gap:14px 16px}
 .mkt .val{font-size:13px}
 .pickrow{flex-wrap:wrap;gap:4px 10px}
 .pts{font-size:20px}
 .cmprow{grid-template-columns:1fr 1fr;gap:10px 14px}
 .cmprow .cl{grid-column:1/-1}
 .score{grid-template-columns:1fr;gap:14px;padding:20px}
 .sc .p{font-size:36px}.vs{display:none}
 .radars{grid-template-columns:1fr;gap:26px}
 .hero.landing h1{font-size:36px}.hero.landing .in{padding:44px 16px 36px}
 .lead{font-size:16.5px}
 .pick{grid-template-columns:1fr 1fr;gap:10px 14px;padding:15px 0}
 .pg{grid-column:1/-1}
 .pf.res{align-items:flex-end}
 table{font-size:11.5px}
 th{font-size:8px}
 table{font-size:12.5px}
}
