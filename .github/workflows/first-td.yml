name: First TD and props capture

# Sam posts a first touchdown page and a player props page per game and only keeps the current week
# online, so the tracker saves each page itself, as late before kickoff as it
# can (his injury notes change through the week), then grades it from ESPN.
# Sam releases the Sunday and Monday pages on Saturday (the Thursday page
# comes out earlier), so before then those read "waiting", not a problem.
# A page first seen after kickoff is never saved. GitHub cron is UTC and can
# run several minutes late, so each slot sits well ahead of its kickoffs.
# During EDT: 22:30 UTC is 6:30pm, 12:30 is 8:30am, 16:00 is noon, 19:30 is
# 3:30pm.

on:
  schedule:
    # Thursday 6:30pm ET, ahead of the 8:15 game; Saturday the same, for late-season Saturdays.
    - cron: "30 22 * * 4,6"
    # Sunday 8:30am (London games), noon, 3:30pm and 6:30pm ET.
    - cron: "30 12 * * 0"
    - cron: "0 16 * * 0"
    - cron: "30 19 * * 0"
    - cron: "30 22 * * 0"
    # Monday 6:30pm ET.
    - cron: "30 22 * * 1"
    # Tuesday, Wednesday and Friday 6:30pm ET: picks up the new week soon after
    # Sam posts it (the daily 8am snapshot is the other pass).
    - cron: "30 22 * * 2,3,5"
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Save pregame pages and grade finished games
        env:
          APP_URL: ${{ vars.APP_URL || 'https://fantasy-hub-tan.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          status=$(curl -sS -o response.json -w '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" --max-time 150 "$APP_URL/api/firsttd")
          echo "HTTP $status"
          jq -r '.report | "week \(.week): saved \(.captured | length), waiting \(.waiting | length), kept \(.kept | length), missed \(.missed | length), graded \(.graded | length), paywalled \(.paywalled // [] | length)", (.problems[]? | "problem: \(.)")' response.json | tee -a "$GITHUB_STEP_SUMMARY"
          pstatus=$(curl -sS -o props.json -w '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" --max-time 150 "$APP_URL/api/props")
          echo "props HTTP $pstatus"
          jq -r '.report | "props week \(.week): saved \(.captured | length), kept \(.kept | length), missed \(.missed | length), graded \(.graded | length), paywalled \(.paywalled // [] | length)", (.system[]? | "system: \(.)"), (.problems[]? | "problem: \(.)")' props.json | tee -a "$GITHUB_STEP_SUMMARY"
          lstatus=$(curl -sS -o lines.json -w '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" --max-time 150 "$APP_URL/api/lines")
          echo "lines HTTP $lstatus"
          jq -r '.report | "line archive: saved \(.saved | length), closed \(.closed | length), Kalshi games nfl \(.kalshi.nfl) nba \(.kalshi.nba)", (.problems[]? | "problem: \(.)")' lines.json | tee -a "$GITHUB_STEP_SUMMARY"
          ostatus=$(curl -sS -o ours.json -w '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" --max-time 150 "$APP_URL/api/props/nfl/ours")
          echo "our NFL model HTTP $ostatus"
          jq -r '.report | "our NFL model week \(.week) (nflverse through week \(.nflverseWeek)): saved \(.saved | length), graded \(.graded | length)", (.learning[]? | "learning: \(.)"), (.problems[]? | "problem: \(.)")' ours.json | tee -a "$GITHUB_STEP_SUMMARY"
          fstatus=$(curl -sS -o ourftd.json -w '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" --max-time 150 "$APP_URL/api/firsttd/ours")
          echo "our first TD model HTTP $fstatus"
          jq -r '.report | "our first TD model week \(.week): saved \(.saved | length), graded \(.graded | length)", (.learning[]? | "learning: \(.)"), (.problems[]? | "problem: \(.)")' ourftd.json | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$status" = "200" ] && [ "$pstatus" = "200" ] && [ "$lstatus" = "200" ] && [ "$ostatus" = "200" ] && [ "$fstatus" = "200" ]
