name: Send an email

# Send one of the weekly emails by hand.
#
# The sends are automatic: the pulse fires each one when its window opens and
# the daily Vercel cron is the backstop. This is the third way in, for the week
# a card changes after its email has gone out, or a window is missed. It exists
# as a workflow rather than a curl because CRON_SECRET lives in this repo's
# secrets and in Vercel, and nowhere a person should be pasting it.
#
# Nothing here runs on a schedule. It only runs when you press the button.

on:
  workflow_dispatch:
    inputs:
      email:
        description: "faab (guillotine), midweek (other leagues' waivers) or lineup"
        default: "faab"
        type: choice
        options: [faab, midweek, lineup]
      resend:
        description: "Send again even though this week already went out (1 to resend)"
        default: "1"
      dry:
        description: "Render it and print the size without sending (1 for a dry run)"
        default: ""
      league:
        description: "League id, if you do not want the guillotine league it finds (faab only)"
        default: ""
      test:
        description: "Mark the subject [Test] and ignore the send's own gates (1 to test)"
        default: ""

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send
        env:
          APP_URL: ${{ vars.APP_URL || 'https://fantasy-hub-tan.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          EMAIL: ${{ inputs.email }}
          RESEND: ${{ inputs.resend }}
          TEST: ${{ inputs.test }}
          DRY: ${{ inputs.dry }}
          LEAGUE: ${{ inputs.league }}
        run: |
          case "${EMAIL:-faab}" in
            midweek) path="midweek-email" ;;
            lineup)  path="thursday-email" ;;
            *)       path="faab-email" ;;
          esac

          # force=1 always: pressing the button IS the decision that today is
          # the day, and a run that quietly did nothing because it is the wrong
          # weekday would be the least useful possible answer. For the lineup
          # email force also clears its waiver and rankings gates, which is why
          # it pairs with test when you only want to see the shape.
          url="$APP_URL/api/$path?force=1"
          if [ -n "$RESEND" ]; then url="$url&resend=1"; fi
          if [ -n "$DRY" ]; then url="$url&dry=1"; fi
          if [ -n "$TEST" ]; then url="$url&test=1"; fi
          if [ -n "$LEAGUE" ] && [ "${EMAIL:-faab}" = "faab" ]; then url="$url&league=$LEAGUE"; fi

          status=$(curl -sS -o response.json -w '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" \
            --max-time 90 \
            "$url")
          echo "HTTP $status"

          if [ "$status" != "200" ]; then
            echo "::error::$path returned HTTP $status"
            head -c 500 response.json; echo
            exit 1
          fi

          # A dry run answers with the rendered email itself rather than JSON,
          # and the email is not something to print into a public log. Report
          # that it rendered and how big it was.
          if [ -n "$DRY" ]; then
            bytes=$(wc -c < response.json | tr -d ' ')
            echo "dry run: email rendered, $bytes bytes" | tee -a "$GITHUB_STEP_SUMMARY"
            grep -o 'Joe Burrow\|Rashee Rice\|chains' response.json | sort -u | head -5
            exit 0
          fi

          jq -r 'to_entries[] | "\(.key): \(.value | tostring | .[0:200])"' response.json \
            | tee -a "$GITHUB_STEP_SUMMARY"

          jq -e '.ok == true' response.json > /dev/null
