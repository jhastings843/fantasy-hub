name: Waiver research

# Tuesday's waiver consensus, researched on the open web by Claude and cached
# for the waiver pages. Runs Tuesday morning and again Tuesday evening
# (Eastern), so a Tuesday injury update is in the evening pass. Separate from
# the pulse because a web-search turn runs a minute or two and the pulse
# shares a 50-second budget across everything it does.
#
# Since 2026-11-03 the research runs here on the runner (15-minute budget),
# not in the Vercel route (5-minute ceiling): a single redraft search turn
# ran past 3.5 minutes that morning. Until the runner has its secrets
# (ANTHROPIC_API_KEY, UPSTASH_REDIS_REST_URL, UPSTASH_REDIS_REST_TOKEN) the
# job falls back to the old route call.
#
# GitHub cron is UTC. 13:00 UTC is 9am EDT (8am EST); 00:00 UTC Wednesday is
# 8pm EDT Tuesday (7pm EST).

on:
  schedule:
    - cron: "0 13 * * 2"
    - cron: "0 0 * * 3"
  workflow_dispatch:
    inputs:
      format:
        description: "all, dynasty or redraft"
        default: "all"
      force:
        description: "Re-research even if this week is cached (1 to force)"
        default: ""

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      APP_URL: ${{ vars.APP_URL || 'https://fantasy-hub-tan.vercel.app' }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      FORMAT: ${{ inputs.format || 'all' }}
      FORCE: ${{ inputs.force }}
    steps:
      - name: Which path
        id: path
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ] && [ -n "$UPSTASH_REDIS_REST_URL" ] && [ -n "$UPSTASH_REDIS_REST_TOKEN" ]; then
            echo "runner=1" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Runner secrets missing; using the Vercel route (5-minute ceiling, redraft may time out)"
            echo "runner=0" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.path.outputs.runner == '1'
        uses: actions/checkout@v4
      - if: steps.path.outputs.runner == '1'
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - if: steps.path.outputs.runner == '1'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: steps.path.outputs.runner == '1'
        run: pnpm install --frozen-lockfile
      - name: Research on the runner
        if: steps.path.outputs.runner == '1'
        run: |
          pnpm dlx tsx@4 --tsconfig scripts/tsconfig.json scripts/waiver-research.mts \
            --format "$FORMAT" ${FORCE:+--force}
      - name: Research through the Vercel route (fallback)
        if: steps.path.outputs.runner != '1'
        run: |
          # One format per request: the function has a five-minute ceiling.
          if [ "$FORMAT" = "all" ]; then formats="dynasty redraft"; else formats="$FORMAT"; fi
          failed=0
          for f in $formats; do
            url="$APP_URL/api/waiver-research?format=$f"
            if [ -n "$FORCE" ]; then url="$url&force=$FORCE"; fi
            status=$(curl -sS -X POST -o "response-$f.json" -w '%{http_code}' \
              -H "Authorization: Bearer $CRON_SECRET" \
              --max-time 320 \
              "$url")
            echo "$f: HTTP $status"
            if [ "$status" = "200" ]; then
              jq -r '
                "week: \(.week)",
                (.results | to_entries[] | "\(.key): " + (if .value.ok then "\(.value.targets) targets" + (if .value.cached then " (cached)" else "" end) + " | " + (.value.top | join(", ")) else "FAILED: " + .value.error end))
              ' "response-$f.json" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::$f research returned HTTP $status"
              head -c 1000 "response-$f.json"; echo
              failed=1
            fi
          done
          exit $failed
