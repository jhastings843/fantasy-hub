name: Picks UI check

# Weekly usability check of the live Picks tab, recorded in the learning
# journal. Report only: it never edits the layout. Layout changes go through
# a reviewed session with these same checks, and are reverted by git revert.

on:
  schedule:
    # Wednesday 14:00 UTC (10am ET), after Tuesday's card.
    - cron: "0 14 * * 3"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04 # Playwright 1.56 has no chromium build for 26.04 (ubuntu-latest since late Oct 2026)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Outside the repo: npm can't install into this pnpm workspace ("Cannot read properties of null (reading 'edgesOut')", every run since 2026-10-21).
      - name: Install a browser for the check
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y > /dev/null
          npm i playwright@1.56.1
          npx playwright install --with-deps chromium
          cp "$GITHUB_WORKSPACE/scripts/picks-ui-check.mjs" .
      - name: Check the live page
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: cd "$RUNNER_TEMP/pw" && node picks-ui-check.mjs https://fantasy-hub-tan.vercel.app
